[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rangedock"
version = "0.2.1"
description = "CLI-managed Docker workspaces for security labs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "shookapic" }]
keywords = ["docker", "security", "workspace", "ctf", "cli"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
rangedock = "rangedock.cli:main"

[project.urls]
Repository = "https://github.com/shookapic/rangedock"
Issues = "https://github.com/shookapic/rangedock/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rangedock = ["Dockerfile"]
