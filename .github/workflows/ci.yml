name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: rangedock --help
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: rangedock build
      - run: rangedock create smoke --workspace "$RUNNER_TEMP/rangedock-smoke"
      - run: rangedock run smoke -- nmap --version
      - run: rangedock run smoke -- sh -c 'echo persisted > /workspace/proof.txt'
      - run: test "$(cat "$RUNNER_TEMP/rangedock-smoke/proof.txt")" = persisted
      - run: rangedock stop smoke
      - run: rangedock remove smoke
      - run: test -f "$RUNNER_TEMP/rangedock-smoke/proof.txt"
