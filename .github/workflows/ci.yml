name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: rangedock --help
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e .
      - run: rangedock build
      - run: printf 'exit\n' | rangedock open smoke --workspace "$RUNNER_TEMP/rangedock-smoke"
      - run: rangedock info smoke
      - run: rangedock run smoke -- nmap --version
      - run: rangedock run smoke -- sh -c 'echo persisted > /workspace/proof.txt'
      - run: test "$(cat "$RUNNER_TEMP/rangedock-smoke/proof.txt")" = persisted
      - run: rangedock restart smoke
      - run: rangedock stop smoke
      - run: rangedock remove smoke
      - run: test -f "$RUNNER_TEMP/rangedock-smoke/proof.txt"
  image-macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: docker/setup-docker-action@v5
      - run: python -m pip install -e .
      - run: rangedock build
      - run: printf 'exit\n' | rangedock open smoke --workspace "$RUNNER_TEMP/rangedock-smoke"
      - run: rangedock run smoke -- sh -c 'echo persisted > /workspace/proof.txt'
      - run: test "$(cat "$RUNNER_TEMP/rangedock-smoke/proof.txt")" = persisted
      - run: rangedock stop smoke
      - run: rangedock remove smoke
      - run: test -f "$RUNNER_TEMP/rangedock-smoke/proof.txt"
