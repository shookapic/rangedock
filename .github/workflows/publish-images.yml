name: Publish images
on:
  push:
    tags:
      - 'v*.*.0'
permissions:
  contents: read
jobs:
  publish:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [base, web, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./src/rangedock
          file: ./src/rangedock/Dockerfile
          target: ${{ matrix.profile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.profile }}
          sbom: true
          provenance: true
  verify:
    needs: publish
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Pull and check base without registry credentials
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}-base
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.ref_name }}-base nmap --version
      - name: Pull and check web without registry credentials
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}-web
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.ref_name }}-web sh -c 'command -v john && command -v hydra && test -f /usr/share/seclists/Discovery/Web-Content/common.txt'
      - name: Pull and check desktop without registry credentials
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}-desktop
          docker run --rm ghcr.io/${{ github.repository }}:${{ github.ref_name }}-desktop sh -c 'command -v websockify && ! command -v burpsuite'
